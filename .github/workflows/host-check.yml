name: Repository checks
on:
  push:
  pull_request:
jobs:
  shell-and-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check scaffold
        run: |
          bash -n scripts/generate-goose-c.sh
          test -f main/app_main.c
          test -f experiments/hello.goose
